{% extends 'courses/base.html' %}

{% block title %}Освітня Платформа - Список Курсів{% endblock %}

{% block main %}
<main>
    <strong>Список Курсів</strong>

    <ul>
    {% for course in courses_list %}
        <li><a href="{% url 'course_details' course.id %}">{{ course.name }}</a></li>
    {% empty %}
        Немає курсів
    {% endfor %}
    </ul>
</main>
{% endblock %}
