{% extends 'courses/base.html' %}

{% block title %}Освітня Платформа - Деталі Курсу{% endblock %}

{% block main %}
<main>
    {% if course %}
        <div>
            <label>Назва Курсу: </label>{{ course.name }}
        </div>
        <div>
            <label>Опис Курсу: </label>{{ course.description|truncatewords:4 }}
        </div>
    {% else %}
        <div>Курс Не Знайдено</div>
    {% endif %}
</main>
{% endblock %}
