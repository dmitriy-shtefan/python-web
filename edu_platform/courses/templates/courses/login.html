{% extends 'courses/base.html' %}

{% block title %}Освітня Платформа - Авторизація{% endblock %}

{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'courses/css/login.css' %}" />
{% endblock %}

{% block main %}
<main class="login-page">
    <h1>Вхід</h1>

    {% if form.errors %}
        <p>Неправильний логін або пароль.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Увійти</button>
    </form>
</main>
{% endblock %}
